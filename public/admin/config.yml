          - { name: titleBold, label: "Nagłówek — linia gruba", widget: string }
          - { name: lead, label: "Wstęp", widget: text }
          - name: items
            label: "Zasady"
            label_singular: Zasada
            widget: list
            summary: "{{fields.t}}"
            fields:
              - { name: t, label: "Zasada (nagłówek)", widget: string }
              - { name: d, label: "Wyjaśnienie", widget: text }
              - { name: quoteFrom, label: "Cytat klienta pod zasadą", widget: select, required: false, options: ["", "Przemysław Langier", "Adam Przebinda"] }
          - { name: signature, label: "Podpis", widget: string }
          - { name: signatureRole, label: "Podpis — rola", widget: string, required: false }
