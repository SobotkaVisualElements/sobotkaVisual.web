          - { name: ctaText, label: "Na końcu — zdanie", widget: text, required: false }
          - { name: ctaLabel, label: "Przycisk — napis", widget: string, required: false }
          - { name: ctaHref, label: "Przycisk — link", widget: string, required: false }

  - name: uslugi
    label: "Usługi (podstrony)"
    label_singular: "Usługa"
