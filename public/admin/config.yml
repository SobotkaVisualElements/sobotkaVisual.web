            max: 2
            fields:
              - { name: title, label: "Tytuł", widget: string }
              - { name: body, label: "Opis", widget: text }
              - { name: note, label: "Dodatkowe zdanie", widget: text, required: false }
              - { name: image, label: "Obrazek (gdy brak warstw)", widget: image, required: false, hint: "1920×1200 px" }
              - name: layers
                label: "Warstwy parallaksy (do 3)"
                label_singular: Warstwa
                widget: list
                required: false
                max: 3
                hint: "1920×1200 px. Pierwsza = tło, ostatnia = przód (PNG z przezroczystością)."
                fields: *layerfields
              - { name: strength, label: "Siła parallaksy (%)", widget: number, value_type: int, default: 100, min: 0, max: 200, required: false }

      - name: uslugi_kafelki
        label: "Kafelki „Wszystko, czego potrzebują Twoje media”"
        file: "src/data/home.json"
        fields:
          - name: features
            label: Kafelki usług
            label_singular: Kafelek
            widget: list
            summary: "{{fields.title}}"
            hint: "Przeciągnij, aby zmienić kolejność. Warstwy są opcjonalne — bez nich kafelek pokazuje samą ikonę."
            fields:
              - { name: icon, label: "Ikona (animowana)", widget: select, default: montaz, options: [{ label: "Montaż (oś czasu)", value: montaz }, { label: "Motion (krzywa ruchu)", value: motion }, { label: "Rolki (telefon)", value: rolki }, { label: "Grafika (kadr)", value: grafika }, { label: "Transmisja (ekran z belką)", value: transmisja }, { label: "Dźwięk (fala)", value: dzwiek }, { label: "Kamera", value: kamera }, { label: "Strategia (cel)", value: strategia }] }
              - { name: title, label: "Tytuł", widget: string }
              - { name: body, label: "Opis", widget: text }
              - name: layers
                label: "Warstwy parallaksy (opcjonalnie, do 3)"
                label_singular: Warstwa
                widget: list
                required: false
                max: 3
                hint: "1920×1200 px. Pierwsza = tło, ostatnia = przód."
                fields: *layerfields
              - { name: strength, label: "Siła parallaksy (%)", widget: number, value_type: int, default: 100, min: 0, max: 200, required: false }

      - name: kolejnosc
        label: "Kolejność sekcji"
        file: "src/data/home.json"
        description: "Hero zawsze jest na górze. Przeciągnij sekcje, aby zmienić kolejność. Usunięta sekcja znika ze strony (możesz ją dodać z powrotem)."
        fields:
          - name: realizacje
            label: "Karuzela „Ostatnie realizacje”"
            widget: object
            fields:
              - { name: eyebrow, label: "Nadtytuł", widget: string }
              - { name: title, label: "Tytuł — część pogrubiona", widget: string }
              - { name: titleLight, label: "Tytuł — część jasna", widget: string, required: false }
              - { name: lead, label: "Zdanie pod tytułem", widget: text, required: false }
              - { name: limit, label: "Ile realizacji pokazać", widget: number, value_type: int, default: 9, min: 3, max: 20 }
              - { name: showLogos, label: "Pokaż logo klienta na kafelkach karuzeli", widget: boolean, default: true, required: false }
          - name: booking
            label: "Rezerwacja rozmowy (kalendarz)"
            widget: object
            required: false
            fields:
              - { name: url, label: "Link do kalendarza (Cal.com, Calendly, Google)", widget: string, required: false, hint: "Puste = przycisk z telefonem." }
              - { name: label, label: "Napis na przycisku", widget: string, default: "Umów 15 minut rozmowy", required: false }
              - { name: note, label: "Dopisek pod przyciskiem", widget: string, required: false }
          - name: liczby
            label: "Pasek „w liczbach” (pod pierwszym ekranem)"
            widget: object
            required: false
            fields:
              - { name: show, label: "Pokaż", widget: boolean, default: true, required: false }
              - name: items
                label: "Liczby (do 4, tylko prawdziwe)"
                label_singular: Liczba
                widget: list
                max: 4
                summary: "{{fields.pre}}{{fields.v}}{{fields.suf}} {{fields.d}}"
                fields:
                  - { name: pre, label: "Przed liczbą (np. od )", widget: string, required: false }
                  - { name: v, label: "Liczba", widget: number, value_type: float }
                  - { name: suf, label: "Po liczbie (%, +)", widget: string, required: false }
                  - { name: d, label: "Opis", widget: string }
          - name: oferta
            label: "Oferta — pakiety (zielone „Zyskujesz”)"
            widget: object
            required: false
            fields:
              - { name: saveLabel, label: "Napis nad kwotą", widget: string, default: "Zyskujesz", required: false }
              - { name: compareLabel, label: "Z czym porównujemy", widget: string, default: "wartość przy zamawianiu osobno", required: false, hint: "Np. „średnio u agencji w Opolu” — tylko jeśli masz realne ceny konkurencji." }
              - name: values
                label: "Wartość do porównania (zł / mies.) — puste = liczona z cennika usług"
                widget: object
                required: false
                fields:
                  - { name: start, label: "START", widget: number, value_type: int, required: false }
                  - { name: pro, label: "PRO", widget: number, value_type: int, required: false }
                  - { name: studio, label: "STUDIO", widget: number, value_type: int, required: false }
              - { name: showLandings, label: "Pokaż linki do landingów pod generatorem", widget: boolean, default: false, required: false }
          - name: sections
            label: "Sekcje pod Hero"
            label_singular: Sekcja
            widget: list
            field: { name: section, label: "Sekcja", widget: select, options: [{ label: "Ostatnie realizacje — karuzela", value: realizacje }, { label: "Usługi — Wszystko, czego potrzebują Twoje media", value: uslugi }, { label: "Dla kogo", value: dlaKogo }, { label: "Oferta — pakiety", value: oferta }, { label: "Opinie", value: opinie }, { label: "FAQ — pytania", value: faq }, { label: "Kontakt — końcowe wezwanie", value: kontakt }, { label: "Jak pracujemy — 6 kroków", value: proces }, { label: "Darmowa rolka próbna — formularz", value: probna }, { label: "Dzień contentowy + dojazd", value: dzien }] }

  - name: manifest
    label: "Manifest (filozofia tworzenia)"
    files:
      - name: manifest
        label: "Manifest — /manifest"
        file: "src/data/manifest.json"
