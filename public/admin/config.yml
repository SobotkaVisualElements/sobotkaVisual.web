backend:
  name: github
  repo: SobotkaVisualElements/sobotkaVisual.web
  branch: main
  base_url: https://sobotkavisual.pl
  auth_endpoint: oauth

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

site_url: https://sobotkavisual.pl
display_url: https://sobotkavisual.pl

media_folder: "public/uploads"
public_folder: "/uploads"
locale: pl

collections:
  - name: realizacje
    label: Realizacje
    label_singular: Realizacja
    folder: "src/content/work"
    preview_path: "work/{{slug}}/"
    create: true
    slug: "{{slug}}"
    media_folder: "/public/uploads/realizacje"
    public_folder: "/uploads/realizacje"
    fields:
      - { name: title, label: "Tytuł", widget: string }
      - { name: description, label: "Krótki opis", widget: text }
      - { name: category, label: "Kategoria", widget: select, options: ["Montaż", "Animacja", "Identyfikacja", "Oprawa transmisyjna", "Grafika"] }
      - { name: client, label: "Klient", widget: string, required: false }
      - { name: clientLogo, label: "Logotyp klienta", widget: image, required: false, hint: "PNG lub SVG z przezroczystym tłem. Pokazuje się w nagłówku realizacji, na kafelku i w karuzeli." }
      - { name: clientLogoTone, label: "Kolor logotypu", widget: select, default: ciemne, required: false, options: [{ label: "Ciemny (przyciemnia białe i kolorowe logo)", value: ciemne }, { label: "Oryginalne kolory", value: oryginalne }] }
      - { name: role, label: "Rola / zakres", widget: string, required: false }
      - { name: year, label: "Rok", widget: number, value_type: int, default: 2026 }
      - { name: date, label: "Data realizacji", widget: datetime, time_format: false, date_format: "DD.MM.YYYY", format: "YYYY-MM-DD", required: false, hint: "Najnowsze realizacje pokazują się na górze listy i w karuzeli na głównej." }
      - { name: collab, label: "Współpraca stała", widget: boolean, default: false, required: false, hint: "Włącz, jeśli to stała współpraca (abonament), a nie jednorazowe zlecenie." }
      - { name: collabStatus, label: "Współpraca — status", widget: select, default: aktywna, required: false, options: [{ label: "Aktywna (trwa)", value: aktywna }, { label: "Zakończona", value: zakonczona }] }
      - { name: collabFrom, label: "Współpraca — od", widget: datetime, time_format: false, date_format: "MM.YYYY", format: "YYYY-MM-DD", required: false }
      - { name: collabTo, label: "Współpraca — do (tylko gdy zakończona)", widget: datetime, time_format: false, date_format: "MM.YYYY", format: "YYYY-MM-DD", required: false }
      - { name: tech, label: "Narzędzia", widget: list, required: false }
      - { name: cover, label: "Baner 1920×1200 (kafelek i nagłówek)", widget: image, required: false, hint: "Poziomy baner 16:10. Używany na kafelkach i w nagłówku realizacji, gdy nie ma filmu ani warstw." }
      - { name: poster, label: "Okładka pionowa 1200×1920 (karuzela na głównej)", widget: image, required: false, hint: "Pion 10:16. Bez niej karuzela przytnie baner." }
      - { name: youtube, label: "Film YouTube w nagłówku (zamiast baneru)", widget: string, required: false, hint: "Link do Twojego filmu. Gra w pętli, bez dźwięku, z przyciskiem włączania dźwięku." }
      - { name: video, label: "albo własny plik MP4 w nagłówku", widget: file, required: false, hint: "Do ok. 20 MB. Pętla bez kontrolek, z przyciskiem dźwięku." }
      - { name: videoUrl, label: "albo link do filmu z media.sobotkavisual.pl (zalecane)", widget: string, required: false, hint: "Wybierz film w bibliotece [media.sobotkavisual.pl](https://media.sobotkavisual.pl) → Kopiuj link → wklej tutaj. Ma pierwszeństwo przed plikiem." }
      - name: layers
        label: "Warstwy parallaksy (do 3)"
        label_singular: Warstwa
        widget: list
        required: false
        max: 3
        summary: "Głębia {{fields.depth}} · skala {{fields.scale}}%"
        hint: "Szablon 16:10. Najlepiej eksportuj z zapasem 25% (np. 2400×1500, kadr 1920×1200 w środku) — obiekty z przodu wychodzą poza kadr i przy ruchu nie widać ich krawędzi. Kadrujesz polami Skala i Kadr. Pierwsza warstwa = tło, ostatnia = przód, PNG z przezroczystością."
        fields: &layerfields
          - { name: image, label: "Obraz (PNG/JPG/WebP 1920×1200)", widget: image }
          - { name: depth, label: "Głębia — jak mocno się rusza (0–100)", widget: number, value_type: int, default: 30, min: 0, max: 100, hint: "Tło 10–20, środek 30–45, przód 55–80. Większa różnica między warstwami = mocniejszy efekt 3D." }
          - { name: scale, label: "Skala / przybliżenie kadru (%)", widget: number, value_type: int, default: 112, min: 100, max: 200, hint: "Zapas na ruch, żeby nie było widać krawędzi. Przy pliku z zapasem (np. 2400×1500) ustaw ok. 125%." }
          - { name: x, label: "Kadr w poziomie (%)", widget: number, value_type: int, default: 50, min: 0, max: 100, required: false, hint: "0 = lewa krawędź obrazu, 50 = środek, 100 = prawa." }
          - { name: y, label: "Kadr w pionie (%)", widget: number, value_type: int, default: 50, min: 0, max: 100, required: false, hint: "0 = góra obrazu, 50 = środek, 100 = dół." }
      - { name: parallaxStrength, label: "Siła parallaksy całego kafelka (%)", widget: number, value_type: int, default: 100, min: 0, max: 200, required: false, hint: "0 = brak ruchu, 100 = standard, 200 = mocno" }
      - { name: featured, label: "Wyróżniona", widget: boolean, default: false }
      - { name: order, label: "Kolejność (gdy ta sama data)", widget: number, value_type: int, default: 10, hint: "Liczy się tylko przy realizacjach z tą samą datą: mniejsza liczba = wyżej." }
      - { name: body, label: "Treść", widget: markdown }
      - name: blocks
        label: "Klocki treści (+)"
        label_singular: Klocek
        widget: list
        required: false
        hint: "Kliknij „Dodaj”, wybierz typ klocka. Klocki pojawiają się pod treścią, w tej kolejności — przeciągnij, aby zmienić."
        types: &blocktypes
          - name: tekst
            label: "Tekst"
            widget: object
            summary: "{{fields.text}}"
            fields:
              - { name: text, label: "Tekst", widget: markdown, hint: "## nagłówek, **pogrubienie**, - lista, [link](/generator)" }
          - name: zdjecie
            label: "Zdjęcie"
            widget: object
            summary: "{{fields.caption}}"
            fields:
              - { name: image, label: "Zdjęcie", widget: image }
              - { name: caption, label: "Podpis", widget: string, required: false }
              - { name: alt, label: "Opis dla Google (alt)", widget: string, required: false }
              - { name: width, label: "Szerokość", widget: select, default: pelna, options: [{ label: "Pełna", value: pelna }, { label: "Wąska", value: waska }] }
          - name: karuzela
            label: "Karuzela zdjęć"
            widget: object
            fields:
              - name: images
                label: "Zdjęcia (16:10)"
                label_singular: Zdjęcie
                widget: list
                fields:
                  - { name: image, label: "Zdjęcie", widget: image }
                  - { name: caption, label: "Podpis", widget: string, required: false }
          - name: oferta
            label: "Przycisk „Sprawdź ofertę” (zielony, do generatora)"
            widget: object
            summary: "{{fields.label}} · {{fields.pakiet}}"
            fields:
              - { name: label, label: "Napis na przycisku", widget: string, default: "Sprawdź ofertę" }
              - { name: lead, label: "Zdanie nad przyciskiem", widget: string, required: false, hint: "Np. Chcesz podobną animację dla swojej książki?" }
              - { name: note, label: "Dopisek pod przyciskiem", widget: string, required: false }
              - { name: tryb, label: "Rodzaj współpracy w generatorze", widget: select, default: jednorazowa, options: [{ label: "Jednorazowa", value: jednorazowa }, { label: "Stała (pakiet miesięczny)", value: stala }] }
              - { name: pakiet, label: "Pakiet (dla współpracy stałej)", widget: select, default: none, options: [{ label: "Bez pakietu", value: none }, { label: "START", value: start }, { label: "PRO", value: pro }, { label: "STUDIO", value: studio }] }
              - name: items
                label: "Co ma być w ofercie"
                label_singular: Element
                widget: list
                required: false
                summary: "{{fields.qty}} × {{fields.id}}"
                fields:
                  - { name: id, label: "Element", widget: select, options: [{ label: "Montaż długiej formy", value: montaz }, { label: "Rolki / shorty / TikTok", value: rolki }, { label: "Animowana rolka", value: rolkaani }, { label: "Skrót meczowy / eventowy", value: skrot }, { label: "Materiał wizerunkowy 2 min", value: wizerunek }, { label: "Element animowany (belka, plansza)", value: animacja }, { label: "Trailer animowany 30–45 s", value: trailer }, { label: "Animowana okładka / motion cover", value: okladka }, { label: "Miniatury / okładki", value: miniatury }, { label: "Grafika statyczna (post, baner)", value: grafika }, { label: "Animowany post promocyjny", value: postani }, { label: "Scenariusz materiału", value: scenariusz }, { label: "Opracowanie dźwięku + licencja", value: dzwiek }, { label: "Lektor profesjonalny", value: lektor }, { label: "Napisy", value: napisy }, { label: "Dzień zdjęciowy", value: zdjecia }] }
                  - { name: qty, label: "Ilość", widget: number, value_type: int, default: 1, min: 0, max: 24 }
              - { name: extras, label: "Rozszerzenia (zaznaczone w generatorze)", widget: select, multiple: true, required: false, options: [{ label: "System oprawy graficznej (wdrożenie)", value: system }, { label: "Pakiet oprawy transmisyjnej", value: trans }, { label: "Tryb ekspresowy (poniżej 48 h)", value: express }, { label: "Dodatkowy format lub wersja językowa", value: format }, { label: "Rozszerzenie praw o kampanie płatne", value: prawa }, { label: "Wyłączność w branży na obszarze", value: wylacz }] }
              - { name: align, label: "Położenie", widget: select, default: srodek, options: [{ label: "Na środku", value: srodek }, { label: "Do lewej", value: lewo }] }
          - name: karuzela3d
            label: "Karuzela 3D (jak na głównej)"
            widget: object
            summary: "{{fields.caption}}"
            fields:
              - { name: orientation, label: "Format kafelków", widget: select, default: poziom, options: [{ label: "Poziome banery 16:10 (realizacje filmowe)", value: poziom }, { label: "Miniatury YouTube 16:9", value: miniatury }, { label: "Pionowe okładki 10:16", value: pion }] }
              - name: items
                label: "Kafelki"
                label_singular: Kafelek
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: image, label: "Obraz", widget: image, required: false, hint: "Możesz pominąć, jeśli wkleisz link YouTube — miniatura pobierze się sama." }
                  - { name: video, label: "Film MP4 — link z biblioteki media.sobotkavisual.pl", widget: string, required: false, hint: "Gra w pętli bez dźwięku, gdy kafelek jest na środku. Obraz powyżej (opcjonalny) to klatka przed wczytaniem. [Otwórz bibliotekę](https://media.sobotkavisual.pl)" }
                  - { name: youtube, label: "Link YouTube (odtwarza się po kliknięciu)", widget: string, required: false }
                  - { name: title, label: "Tytuł pod karuzelą", widget: string, required: false }
                  - { name: link, label: "albo link do strony (np. /work/...)", widget: string, required: false }
                  - { name: logo, label: "Logotyp klienta", widget: image, required: false }
              - { name: showLogos, label: "Pokaż logo klienta na kafelkach", widget: boolean, default: false, required: false }
              - { name: caption, label: "Podpis", widget: string, required: false }
          - name: wideo
            label: "Wideo"
            widget: object
            summary: "{{fields.youtube}}"
            fields:
              - { name: youtube, label: "Link YouTube albo link do pliku MP4", widget: string, required: false, hint: "Link z YouTube albo link do pliku z biblioteki [media.sobotkavisual.pl](https://media.sobotkavisual.pl) (Kopiuj link) — oba zadziałają." }
              - { name: file, label: "albo plik MP4", widget: file, required: false }
              - { name: url, label: "albo link do filmu z media.sobotkavisual.pl (zalecane)", widget: string, required: false, hint: "Wybierz film w bibliotece [media.sobotkavisual.pl](https://media.sobotkavisual.pl) → Kopiuj link → wklej tutaj. Ma pierwszeństwo przed plikiem." }
              - { name: format, label: "Format", widget: select, default: "16:9", options: ["16:9", "9:16"] }
              - { name: mode, label: "Tryb", widget: select, default: petla, options: [{ label: "Pętla bez kontrolek + przycisk dźwięku", value: petla }, { label: "Zwykły odtwarzacz (dla długich filmów)", value: zwykly }] }
              - { name: caption, label: "Podpis", widget: string, required: false }
          - name: parallaksa
            label: "Kafelek z parallaksą"
            widget: object
            fields:
              - name: layers
                label: "Warstwy (do 3, 1920×1200)"
                label_singular: Warstwa
                widget: list
                max: 3
                fields: *layerfields
              - { name: strength, label: "Siła parallaksy (%)", widget: number, value_type: int, default: 100, min: 0, max: 200 }
              - { name: caption, label: "Podpis", widget: string, required: false }
          - name: wykres_przewaga
            label: "Wykres przewagi (typowo vs z nami) — zalecany"
            widget: object
            summary: "{{fields.title}}"
            fields:
              - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
              - { name: title, label: "Tytuł", widget: string, required: false }
              - { name: sub, label: "Opis pod tytułem", widget: text, required: false }
              - { name: watermark, label: "Wielki półprzezroczysty napis", widget: string, required: false }
              - { name: unit, label: "Jednostka (np. %)", widget: string, required: false }
              - { name: curve, label: "Kształt linii", widget: select, default: szybki, options: [{ label: "Szybki wzrost, potem wypłaszczenie", value: szybki }, { label: "Równy wzrost (skala w czasie)", value: liniowy }] }
              - { name: xStart, label: "Oś — początek", widget: string, required: false }
              - { name: xMid, label: "Oś — punkty pośrednie (po przecinku)", widget: string, required: false }
              - { name: xEnd, label: "Oś — koniec", widget: string, required: false }
              - name: base
                label: "Szara linia — typowo / konkurencja"
                widget: object
                fields:
                  - { name: label, label: "Opis", widget: string, required: false }
                  - { name: value, label: "Wartość", widget: number, value_type: float }
                  - { name: display, label: "Własny napis (np. do 10%)", widget: string, required: false }
              - name: ours
                label: "Zielona linia — z nami"
                widget: object
                fields:
                  - { name: label, label: "Opis", widget: string, required: false }
                  - { name: value, label: "Wartość", widget: number, value_type: float }
                  - { name: display, label: "Własny napis", widget: string, required: false }
              - { name: delta, label: "Napis na zielonym obszarze różnicy", widget: string, required: false }
              - { name: source, label: "Źródło danych", widget: text, required: false }
              - { name: quoteFrom, label: "Cytat klienta pod wykresem", widget: select, required: false, options: ["", "Przemysław Langier", "Adam Przebinda"] }
          - name: wykres_liniowy
            label: "(stary) Wykres liniowy (animowany)"
            widget: object
            summary: "{{fields.value}}{{fields.suffix}} — {{fields.label}}"
            fields:
              - { name: value, label: "Wartość (duża liczba)", widget: number, value_type: float, hint: "Np. 21 dla „+21%”. Ujemna = spadek." }
              - { name: label, label: "Czego dotyczy", widget: string, hint: "Np. „CTR miniatur w 1. godzinie”" }
              - { name: points, label: "Punkty wykresu (opcjonalnie)", widget: string, required: false, hint: "Prawdziwe dane po przecinku, np. „21, 15, 15, 9”. Puste = krzywa wzrostu do wartości." }
              - { name: prefix, label: "Przed liczbą", widget: string, required: false, hint: "Puste = automatycznie „+” lub „−”. Wpisz spację, żeby nie było znaku." }
              - { name: suffix, label: "Po liczbie", widget: string, default: "%", required: false }
              - { name: description, label: "Opis pod wykresem", widget: text, required: false }
          - name: wykres_kolowy
            label: "(stary) Wykres kołowy % (animowany)"
            widget: object
            summary: "{{fields.value}}% — {{fields.label}}"
            fields:
              - { name: value, label: "Wartość (0–100)", widget: number, value_type: float, min: 0, max: 100 }
              - { name: label, label: "Czego dotyczy", widget: string }
              - { name: suffix, label: "Po liczbie", widget: string, default: "%", required: false }
              - { name: description, label: "Opis", widget: text, required: false }
          - name: cytat
            label: "Cytat / opinia"
            widget: object
            summary: "{{fields.author}}"
            fields:
              - { name: text, label: "Treść (bez cudzysłowu)", widget: text }
              - { name: author, label: "Autor", widget: string, required: false }
              - { name: role, label: "Rola / firma", widget: string, required: false }

  - name: strona_glowna
    label: "Strona główna"
    files:
      - name: hero
        label: "Hero — pierwszy ekran"
        file: "src/data/home.json"
        description: "Nagłówek, opis, przyciski i wideo w tle. Zmiany zobaczysz w podglądzie przed publikacją."
        fields:
          - name: hero
            label: "Hero"
            widget: object
            fields:
              - { name: h1prefix, label: "Nagłówek — pierwsze słowo", widget: string }
              - { name: h1accent, label: "Nagłówek — słowo w kolorze", widget: string }
              - { name: lead, label: "Zdanie pod nagłówkiem", widget: text }
              - { name: ctaPrimaryLabel, label: "Przycisk główny — napis", widget: string }
              - { name: ctaPrimaryHref, label: "Przycisk główny — dokąd prowadzi", widget: string, default: "/#kontakt" }
              - { name: ctaSecondaryLabel, label: "Przycisk drugi — napis", widget: string }
              - { name: ctaSecondaryHref, label: "Przycisk drugi — dokąd prowadzi", widget: string, default: "/work" }
              - { name: video, label: "Wideo w tle (MP4)", widget: file, required: false, hint: "Krótka pętla, wyciszona, do 3 MB. Na telefonie pokaże się plakat zamiast wideo." }
              - { name: videoUrl, label: "albo link do wideo w tle z media.sobotkavisual.pl", widget: string, required: false, hint: "Wybierz film w bibliotece [media.sobotkavisual.pl](https://media.sobotkavisual.pl) → Kopiuj link → wklej tutaj. Ma pierwszeństwo przed plikiem." }
              - { name: poster, label: "Plakat / klatka zastępcza", widget: image, required: false, hint: "Widoczny na telefonie i zanim wideo się wczyta." }
              - { name: videoOpacity, label: "Przyciemnienie tła (%)", widget: number, value_type: int, default: 30, min: 5, max: 70, hint: "Im mniej, tym ciemniejsze tło i czytelniejszy tekst." }
              - { name: clientsLabel, label: "Napis nad logotypami", widget: string, default: "Zaufali nam" }
          - name: clients
            label: "Logotypy „Zaufali nam”"
            label_singular: Logotyp
            widget: list
            summary: "{{fields.name}}"
            hint: "Przeciągnij, aby zmienić kolejność. Używaj białych logotypów (SVG lub PNG z przezroczystym tłem)."
            fields:
              - { name: name, label: "Nazwa klienta", widget: string, hint: "Wyświetla się czytnikom ekranu i Google" }
              - { name: logo, label: "Logotyp", widget: image }
              - { name: height, label: "Wysokość (px)", widget: number, value_type: int, default: 28, min: 16, max: 80, hint: "Wyrównaj wizualnie z resztą. Typowo 24–36, wysokie logo nawet 48." }
          - name: uslugi
            label: "Sekcja: Usługi"
            widget: object
            fields:
              - { name: titleBig, label: "Duże słowo", widget: string }
              - { name: titleSmall, label: "Druga linia", widget: string }
              - { name: lead, label: "Zdanie pod tytułem", widget: text }
          - name: dlaKogo
            label: "Sekcja: Dla kogo"
            widget: object
            fields:
              - { name: eyebrow, label: "Nadtytuł", widget: string }
              - { name: titleLine1, label: "Tytuł — linia 1", widget: string }
              - { name: titleLine2, label: "Tytuł — linia 2", widget: string }
              - name: tabs
                label: "Zakładki (Marketing / HR / Sprzedaż / Sport) — puste = domyślne"
                label_singular: Zakładka
                widget: list
                required: false
                max: 5
                summary: "{{fields.label}}"
                fields:
                  - { name: label, label: "Napis na zakładce", widget: string }
                  - { name: title, label: "Nagłówek", widget: string }
                  - { name: body, label: "Opis", widget: text }
                  - { name: points, label: "Co dostajesz (punkty)", widget: list, field: { name: point, label: Punkt, widget: string } }
                  - { name: cta, label: "Napis na przycisku", widget: string, required: false }
                  - { name: href, label: "Link przycisku", widget: string, required: false, hint: "np. /generator?pakiet=pro albo #dzien" }
          - name: proces
            label: "Sekcja: Jak pracujemy (6 kroków)"
            widget: object
            required: false
            fields:
              - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
              - { name: title, label: "Tytuł", widget: string, required: false }
              - name: steps
                label: "Kroki — puste = domyślne"
                label_singular: Krok
                widget: list
                required: false
                max: 6
                summary: "{{fields.t}}"
                fields:
                  - { name: t, label: "Krok", widget: string }
                  - { name: d, label: "Opis", widget: text }
          - name: probna
            label: "Sekcja: Darmowa rolka próbna"
            widget: object
            required: false
            fields:
              - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
              - { name: title, label: "Tytuł", widget: string, required: false }
              - { name: lead, label: "Zdanie pod tytułem", widget: text, required: false }
              - { name: rules, label: "Warunki (punkty)", widget: list, required: false, field: { name: rule, label: Warunek, widget: string } }
              - { name: button, label: "Napis na przycisku", widget: string, required: false }
          - name: dzien
