    format: json
    create: true
    preview_path: "uslugi/{{slug}}/"
    identifier_field: name
    summary: "{{name}}"
    sortable_fields: [order, name]
    description: "Każda usługa = osobna podstrona /uslugi/<adres> (dobre pod Google). Ceny biorą się same z cennika generatora."
    fields:
      - { name: name, label: "Nazwa usługi", widget: string }
      - { name: order, label: "Kolejność", widget: number, value_type: int, default: 10 }
      - { name: icon, label: "Ikona", widget: select, options: ["montaz", "motion", "rolki", "grafika", "transmisja", "dzwiek", "kamera", "strategia"] }
      - { name: draft, label: "Szkic (ukryta)", widget: boolean, default: false, required: false }
      - { name: seoTitle, label: "Tytuł dla Google", widget: string, hint: "Do 60 znaków" }
      - { name: seoDesc, label: "Opis dla Google", widget: text, hint: "120–160 znaków" }
      - name: hero
        label: "Pierwszy ekran"
        widget: object
        fields:
          - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
          - { name: title, label: "Nagłówek — linia cienka", widget: string }
          - { name: titleBold, label: "Nagłówek — linia gruba", widget: string }
          - { name: lead, label: "Opis", widget: text }
      - name: deliver
        label: "Co dostajesz"
        widget: object
        fields:
          - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
          - { name: title, label: "Tytuł — pogrubiony", widget: string, required: false }
          - { name: titleLight, label: "Tytuł — jasny", widget: string, required: false }
          - { name: items, label: "Elementy", label_singular: Element, widget: list, summary: "{{fields.t}}", fields: [{ name: t, label: "Tytuł", widget: string }, { name: d, label: "Opis", widget: text }] }
      - name: process
        label: "Jak to robimy"
        widget: object
        fields:
          - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
          - { name: title, label: "Tytuł — pogrubiony", widget: string, required: false }
          - { name: titleLight, label: "Tytuł — jasny", widget: string, required: false }
          - { name: items, label: "Kroki", label_singular: Krok, widget: list, summary: "{{fields.t}}", fields: [{ name: t, label: "Krok", widget: string }, { name: d, label: "Opis", widget: text }] }
      - name: prices
        label: "Ceny (z cennika generatora)"
        widget: object
        fields:
          - { name: title, label: "Tytuł", widget: string, required: false }
          - { name: note, label: "Dopisek", widget: text, required: false }
          - { name: items, label: "Pozycje z cennika", widget: select, multiple: true, options: [{ label: "Montaż długiej formy", value: montaz }, { label: "Rolki / shorty", value: rolki }, { label: "Animowana rolka", value: rolkaani }, { label: "Skrót meczowy / eventowy", value: skrot }, { label: "Materiał wizerunkowy", value: wizerunek }, { label: "Element animowany", value: animacja }, { label: "Trailer animowany", value: trailer }, { label: "Animowana okładka", value: okladka }, { label: "Miniatury / okładki", value: miniatury }, { label: "Grafika statyczna", value: grafika }, { label: "Animowany post", value: postani }, { label: "Scenariusz", value: scenariusz }, { label: "Dźwięk + licencja", value: dzwiek }, { label: "Lektor", value: lektor }, { label: "Napisy", value: napisy }, { label: "Dzień zdjęciowy", value: zdjecia }] }
          - { name: extras, label: "Pakiety dodatkowe", widget: select, multiple: true, required: false, options: [{ label: "System oprawy graficznej", value: system }, { label: "Pakiet oprawy transmisyjnej", value: trans }] }
      - name: work
        label: "Realizacje"
        widget: object
        fields:
          - { name: categories, label: "Pokaż realizacje z kategorii", widget: select, multiple: true, options: ["Montaż", "Animacja", "Identyfikacja", "Oprawa transmisyjna", "Grafika"] }
          - { name: title, label: "Tytuł — pogrubiony", widget: string, required: false }
          - { name: titleLight, label: "Tytuł — jasny", widget: string, required: false }
      - { name: cities, label: "Strony lokalne (adresy z /uslugi/, np. montaz-wideo-opole)", widget: list, required: false }
      - name: faq
        label: "Pytania"
        label_singular: Pytanie
        widget: list
        summary: "{{fields.q}}"
        fields:
          - { name: q, label: "Pytanie", widget: string }
          - { name: a, label: "Odpowiedź", widget: text }
      - name: blocks
        label: "Dodatkowe klocki (np. wykres przewagi, wideo)"
        label_singular: Klocek
        widget: list
        required: false
        types: *blocktypes

  - name: landingi
    label: "Landingi ofert"
    label_singular: "Landing"
    folder: "src/data/oferty"
    preview_path: "oferta/{{slug}}/"
    extension: json
    format: json
    create: true
    identifier_field: name
    slug: "{{slug}}"
    summary: "{{name}}"
    media_folder: "/public/uploads/oferty"
    public_folder: "/uploads/oferty"
    description: "Wszystkie linki do kopiowania (też ukrytych ofert): sobotkavisual.pl/linki. Strony /oferta/<adres>. Nowy landing: otwórz istniejący → menu „…” → Duplikuj, zmień nazwę i treść. Adres powstaje z nazwy przy pierwszym zapisie. Enter = nowa linia, **tekst** = pogrubienie."
    fields:
      - { name: name, label: "Nazwa (w linkach „Zobacz też”)", widget: string }
      - { name: layout, label: "Wygląd strony", widget: select, default: klasyczny, options: [{ label: "Klasyczny", value: klasyczny }, { label: "Kinetyczny — animacje przy przewijaniu", value: kinetyczny }] }
      - { name: theme, label: "Motyw (dla wyglądu kinetycznego)", widget: select, default: jasny, required: false, options: [{ label: "Jasny (wzorzec)", value: jasny }, { label: "Ciemny", value: ciemny }, { label: "Świąteczny (śnieg i kształty 3D w tle)", value: swiateczny }, { label: "Izometryczny (neon, platformy 3D)", value: izometryczny }] }
      - { name: marquee, label: "Wielki przesuwający się napis (kinetyczny)", widget: string, required: false, hint: "Słowa oddzielone ukośnikiem, np. MONTAŻ / ANIMACJA / ROLKI. Puste = tytuły z sekcji „Co w środku”." }
      - { name: draft, label: "Szkic (strona nie istnieje)", widget: boolean, default: false, required: false }
      - { name: noindex, label: "Ukryj przed Google (tylko z linku)", widget: boolean, default: false, required: false, hint: "Dla ofert prywatnych i sezonowych wysyłanych mailem." }
      - { name: order, label: "Kolejność", widget: number, value_type: int, default: 1 }
      - { name: seoTitle, label: "Tytuł dla Google", widget: string, hint: "Do 60 znaków" }
      - { name: seoDesc, label: "Opis dla Google", widget: text, hint: "120–160 znaków" }
      - { name: service, label: "Nazwa usługi (dane dla Google)", widget: string }
      - { name: pdf, label: "Plik PDF oferty", widget: file, required: false }
      - { name: pkg, label: "Pakiet w generatorze", widget: select, default: pro, options: [start, pro, studio, none] }
      - name: ui
        label: "Układ i rozmiary (podgląd: dopisz ?edytuj do adresu strony)"
        widget: object
        required: false
        collapsed: true
        hint: "Bez kodu: ukryj sekcje, zmień wielkość napisów, odstępy i długość animowanych scen. Otwórz stronę z ?edytuj na końcu adresu — każda sekcja pokaże swoją nazwę z panelu."
        fields:
          - { name: hide, label: "Ukryj sekcje", widget: select, multiple: true, required: false, options: [{ label: "Pierwszy ekran", value: hero }, { label: "Przelatujące karty (kinetyczny)", value: marquee }, { label: "Tekst zapalany słowami + liczby (kinetyczny)", value: mission }, { label: "Kroki „Kim się stajesz”", value: steps }, { label: "Wielkie numery (kinetyczny)", value: bigs }, { label: "Zoom z wynikami (kinetyczny)", value: zoom }, { label: "Wykresy", value: charts }, { label: "Opinie", value: opinie }, { label: "Cennik (kinetyczny)", value: cennik }, { label: "Realizacje", value: realizacje }, { label: "Pytania", value: faq }, { label: "Następny krok", value: final }, { label: "Zanim zaczniemy (klasyczny)", value: intro }, { label: "Kim się stajesz (klasyczny)", value: become }, { label: "Liczby rynku (klasyczny)", value: stats }, { label: "Wyniki (klasyczny)", value: proof }, { label: "Co w środku (klasyczny)", value: inside }, { label: "Sekcja specjalna (klasyczny)", value: special }, { label: "Wątpliwości (klasyczny)", value: doubts }, { label: "Inwestycja (klasyczny)", value: invest }] }
          - { name: headSize, label: "Wielkość nagłówków", widget: select, default: M, required: false, options: [{ label: "Mniejsze", value: S }, { label: "Standard", value: M }, { label: "Większe", value: L }, { label: "Ogromne", value: XL }] }
          - { name: wordsSize, label: "Wielkość tekstu zapalanego słowami", widget: select, default: M, required: false, options: [{ label: "Mniejszy", value: S }, { label: "Standard", value: M }, { label: "Większy", value: L }] }
          - { name: spacing, label: "Odstępy między sekcjami", widget: select, default: normalnie, required: false, options: [{ label: "Ciasno", value: ciasno }, { label: "Normalnie", value: normalnie }, { label: "Przestronnie", value: przestronnie }] }
          - { name: sceneLength, label: "Długość animowanych scen (ile trzeba przewinąć)", widget: select, default: normalnie, required: false, options: [{ label: "Krótko", value: krotko }, { label: "Normalnie", value: normalnie }, { label: "Długo", value: dlugo }] }
      - name: deadline
        label: "Termin oferty + odliczanie (kinetyczny)"
        widget: object
        required: false
        collapsed: true
        hint: "Wpisz datę, a pod pierwszym ekranem pojawi się ogromny napis i licznik. Po terminie cała strona sama pokaże ekran „Oferta minęła”."
        fields:
          - { name: date, label: "Koniec oferty (data i godzina)", widget: datetime, required: false, format: "YYYY-MM-DDTHH:mm:ssZ", date_format: "DD.MM.YYYY", time_format: "HH:mm" }
          - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
          - { name: title, label: "Napis — linia 1 (np. Oferta do)", widget: string, required: false }
          - { name: titleBold, label: "Napis — linia 2, ogromna (np. 6 grudnia)", widget: string, required: false }
          - { name: lead, label: "Zdanie pod licznikiem", widget: text, required: false }
          - { name: expiredTitle, label: "Po terminie — tytuł", widget: string, required: false, default: "Oferta minęła." }
          - { name: expiredLead, label: "Po terminie — drugi wiersz", widget: string, required: false, default: "Do zobaczenia za rok!" }
          - { name: expiredHo, label: "Po terminie — skaczący napis", widget: string, required: false, default: "Ho ho ho" }
          - { name: expiredNote, label: "Po terminie — dopisek", widget: text, required: false }
      - name: hero
        label: "1. Pierwszy ekran"
        widget: object
        fields:
          - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
          - { name: title, label: "Nagłówek — linia cienka", widget: string, required: false }
          - { name: titleBold, label: "Nagłówek — linia gruba", widget: string, required: false }
          - { name: lead, label: "Zdanie pod nagłówkiem", widget: text, required: false, hint: "Enter = nowa linia. **tekst** = pogrubienie. Krótkie słowa (i, w, z…) same nie zostaną na końcu linii." }
          - { name: bgImage, label: "Tło — własny obraz (zamiast wideo)", widget: image, required: false }
          - { name: bgVideo, label: "Tło — własne wideo MP4", widget: file, required: false }
          - { name: bgVideoUrl, label: "Tło — albo link do wideo z media.sobotkavisual.pl", widget: string, required: false, hint: "Wybierz film w bibliotece [media.sobotkavisual.pl](https://media.sobotkavisual.pl) → Kopiuj link → wklej tutaj. Ma pierwszeństwo przed plikiem." }
          - { name: bgOpacity, label: "Widoczność tła (%)", widget: number, value_type: int, default: 20, min: 5, max: 80, required: false }
          - { name: sideImage, label: "Obraz obok nagłówka (zamiast karty z ceną)", widget: image, required: false }
          - { name: sideAlt, label: "Opis obrazu (alt)", widget: string, required: false }
