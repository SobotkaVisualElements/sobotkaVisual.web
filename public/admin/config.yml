backend:
  name: github
  repo: SobotkaVisualElements/sobotkaVisual.web
  branch: main
  base_url: https://sobotkavisual.pl
  auth_endpoint: oauth

media_folder: "public/uploads"
public_folder: "/uploads"
locale: pl

collections:
  - name: realizacje
    label: Realizacje
    label_singular: Realizacja
    folder: "src/content/work"
    create: true
    slug: "{{slug}}"
    media_folder: "/public/uploads/realizacje"
    public_folder: "/uploads/realizacje"
    fields:
      - { name: title, label: "Tytuł", widget: string }
      - { name: description, label: "Krótki opis", widget: text }
      - { name: category, label: "Kategoria", widget: select, options: ["Montaż", "Animacja", "Identyfikacja", "Oprawa transmisyjna", "Grafika"] }
      - { name: client, label: "Klient", widget: string, required: false }
      - { name: role, label: "Rola / zakres", widget: string, required: false }
      - { name: year, label: "Rok", widget: number, value_type: int, default: 2026 }
      - { name: tech, label: "Narzędzia", widget: list, required: false }
      - { name: cover, label: "Zdjęcie główne (1920×1200)", widget: image, required: false, hint: "Używane, gdy nie dodasz warstw parallaksy." }
      - name: layers
        label: "Warstwy parallaksy (do 3)"
        label_singular: Warstwa
        widget: list
        required: false
        max: 3
        summary: "Głębia {{fields.depth}} · skala {{fields.scale}}%"
        hint: "Szablon 1920×1200 px (16:10). Pierwsza warstwa = tło, ostatnia = przód. Warstwy 2 i 3 jako PNG z przezroczystością. Przeciągnij, aby zmienić kolejność."
        fields: &layerfields
          - { name: image, label: "Obraz (PNG/JPG/WebP 1920×1200)", widget: image }
          - { name: depth, label: "Głębia — jak mocno się rusza (0–100)", widget: number, value_type: int, default: 30, min: 0, max: 100, hint: "Tło 10–20, środek 30–45, przód 55–80. Większa różnica między warstwami = mocniejszy efekt 3D." }
          - { name: scale, label: "Skala (%)", widget: number, value_type: int, default: 112, min: 100, max: 160, hint: "Zapas na ruch, żeby nie było widać krawędzi. Im większa głębia, tym większa skala." }
      - { name: parallaxStrength, label: "Siła parallaksy całego kafelka (%)", widget: number, value_type: int, default: 100, min: 0, max: 200, required: false, hint: "0 = brak ruchu, 100 = standard, 200 = mocno" }
      - { name: featured, label: "Wyróżniona", widget: boolean, default: false }
      - { name: order, label: "Kolejność", widget: number, value_type: int, default: 10 }
      - { name: body, label: "Treść", widget: markdown }
      - name: blocks
        label: "Klocki treści (+)"
        label_singular: Klocek
        widget: list
        required: false
        hint: "Kliknij „Dodaj”, wybierz typ klocka. Klocki pojawiają się pod treścią, w tej kolejności — przeciągnij, aby zmienić."
        types: &blocktypes
          - name: tekst
            label: "Tekst"
            widget: object
            summary: "{{fields.text}}"
            fields:
              - { name: text, label: "Tekst", widget: markdown, hint: "## nagłówek, **pogrubienie**, - lista, [link](/generator)" }
          - name: zdjecie
            label: "Zdjęcie"
            widget: object
            summary: "{{fields.caption}}"
            fields:
              - { name: image, label: "Zdjęcie", widget: image }
              - { name: caption, label: "Podpis", widget: string, required: false }
              - { name: alt, label: "Opis dla Google (alt)", widget: string, required: false }
              - { name: width, label: "Szerokość", widget: select, default: pelna, options: [{ label: "Pełna", value: pelna }, { label: "Wąska", value: waska }] }
          - name: karuzela
            label: "Karuzela zdjęć"
            widget: object
            fields:
              - name: images
                label: "Zdjęcia (16:10)"
                label_singular: Zdjęcie
                widget: list
                fields:
                  - { name: image, label: "Zdjęcie", widget: image }
                  - { name: caption, label: "Podpis", widget: string, required: false }
          - name: wideo
            label: "Wideo"
            widget: object
            summary: "{{fields.youtube}}"
            fields:
              - { name: youtube, label: "Link YouTube", widget: string, required: false, hint: "Zwykły link do filmu lub shorta. Ładuje się dopiero po kliknięciu — strona zostaje szybka." }
              - { name: file, label: "albo plik MP4", widget: file, required: false }
              - { name: format, label: "Format", widget: select, default: "16:9", options: ["16:9", "9:16"] }
              - { name: caption, label: "Podpis", widget: string, required: false }
          - name: parallaksa
            label: "Kafelek z parallaksą"
            widget: object
            fields:
              - name: layers
                label: "Warstwy (do 3, 1920×1200)"
                label_singular: Warstwa
                widget: list
                max: 3
                fields: *layerfields
              - { name: strength, label: "Siła parallaksy (%)", widget: number, value_type: int, default: 100, min: 0, max: 200 }
              - { name: caption, label: "Podpis", widget: string, required: false }
          - name: wykres_liniowy
            label: "Wykres liniowy (animowany)"
            widget: object
            summary: "{{fields.value}}{{fields.suffix}} — {{fields.label}}"
            fields:
              - { name: value, label: "Wartość (duża liczba)", widget: number, value_type: float, hint: "Np. 21 dla „+21%”. Ujemna = spadek." }
              - { name: label, label: "Czego dotyczy", widget: string, hint: "Np. „CTR miniatur w 1. godzinie”" }
              - { name: points, label: "Punkty wykresu (opcjonalnie)", widget: string, required: false, hint: "Prawdziwe dane po przecinku, np. „21, 15, 15, 9”. Puste = krzywa wzrostu do wartości." }
              - { name: prefix, label: "Przed liczbą", widget: string, required: false, hint: "Puste = automatycznie „+” lub „−”. Wpisz spację, żeby nie było znaku." }
              - { name: suffix, label: "Po liczbie", widget: string, default: "%", required: false }
              - { name: description, label: "Opis pod wykresem", widget: text, required: false }
          - name: wykres_kolowy
            label: "Wykres kołowy % (animowany)"
            widget: object
            summary: "{{fields.value}}% — {{fields.label}}"
            fields:
              - { name: value, label: "Wartość (0–100)", widget: number, value_type: float, min: 0, max: 100 }
              - { name: label, label: "Czego dotyczy", widget: string }
              - { name: suffix, label: "Po liczbie", widget: string, default: "%", required: false }
              - { name: description, label: "Opis", widget: text, required: false }
          - name: cytat
            label: "Cytat / opinia"
            widget: object
            summary: "{{fields.author}}"
            fields:
              - { name: text, label: "Treść (bez cudzysłowu)", widget: text }
              - { name: author, label: "Autor", widget: string, required: false }
              - { name: role, label: "Rola / firma", widget: string, required: false }

  - name: strona_glowna
    label: "Strona główna"
    files:
      - name: hero
        label: "Hero — pierwszy ekran"
        file: "src/data/home.json"
        description: "Nagłówek, opis, przyciski i wideo w tle. Zmiany zobaczysz w podglądzie przed publikacją."
        fields:
          - name: hero
            label: "Hero"
            widget: object
            fields:
              - { name: h1prefix, label: "Nagłówek — pierwsze słowo", widget: string }
              - { name: h1accent, label: "Nagłówek — słowo w kolorze", widget: string }
              - { name: lead, label: "Zdanie pod nagłówkiem", widget: text }
              - { name: ctaPrimaryLabel, label: "Przycisk główny — napis", widget: string }
              - { name: ctaPrimaryHref, label: "Przycisk główny — dokąd prowadzi", widget: string, default: "/#kontakt" }
              - { name: ctaSecondaryLabel, label: "Przycisk drugi — napis", widget: string }
              - { name: ctaSecondaryHref, label: "Przycisk drugi — dokąd prowadzi", widget: string, default: "/work" }
              - { name: video, label: "Wideo w tle (MP4)", widget: file, required: false, hint: "Krótka pętla, wyciszona, do 3 MB. Na telefonie pokaże się plakat zamiast wideo." }
              - { name: poster, label: "Plakat / klatka zastępcza", widget: image, required: false, hint: "Widoczny na telefonie i zanim wideo się wczyta." }
              - { name: videoOpacity, label: "Przyciemnienie tła (%)", widget: number, value_type: int, default: 30, min: 5, max: 70, hint: "Im mniej, tym ciemniejsze tło i czytelniejszy tekst." }
              - { name: clientsLabel, label: "Napis nad logotypami", widget: string, default: "Zaufali nam" }
          - name: clients
            label: "Logotypy „Zaufali nam”"
            label_singular: Logotyp
            widget: list
            summary: "{{fields.name}}"
            hint: "Przeciągnij, aby zmienić kolejność. Używaj białych logotypów (SVG lub PNG z przezroczystym tłem)."
            fields:
              - { name: name, label: "Nazwa klienta", widget: string, hint: "Wyświetla się czytnikom ekranu i Google" }
              - { name: logo, label: "Logotyp", widget: image }
              - { name: height, label: "Wysokość (px)", widget: number, value_type: int, default: 28, min: 16, max: 80, hint: "Wyrównaj wizualnie z resztą. Typowo 24–36, wysokie logo nawet 48." }
          - name: uslugi
            label: "Sekcja: Usługi"
            widget: object
            fields:
              - { name: titleBig, label: "Duże słowo", widget: string }
              - { name: titleSmall, label: "Druga linia", widget: string }
              - { name: lead, label: "Zdanie pod tytułem", widget: text }
          - name: dlaKogo
            label: "Sekcja: Dla kogo"
            widget: object
            fields:
              - { name: eyebrow, label: "Nadtytuł", widget: string }
              - { name: titleLine1, label: "Tytuł — linia 1", widget: string }
              - { name: titleLine2, label: "Tytuł — linia 2", widget: string }
          - name: kontakt
            label: "Sekcja: Kontakt"
            widget: object
            fields:
              - { name: title, label: "Tytuł", widget: string }
              - { name: lead, label: "Zdanie pod tytułem", widget: text }

      - name: kafelki
        label: "Kafelki „Dla kogo”"
        file: "src/data/home.json"
        fields:
          - name: tiles
            label: Kafelki
            widget: list
            max: 2
            fields:
              - { name: title, label: "Tytuł", widget: string }
              - { name: body, label: "Opis", widget: text }
              - { name: note, label: "Dodatkowe zdanie", widget: text, required: false }
              - { name: image, label: "Obrazek (gdy brak warstw)", widget: image, required: false, hint: "1920×1200 px" }
              - name: layers
                label: "Warstwy parallaksy (do 3)"
                label_singular: Warstwa
                widget: list
                required: false
                max: 3
                hint: "1920×1200 px. Pierwsza = tło, ostatnia = przód (PNG z przezroczystością)."
                fields: *layerfields
              - { name: strength, label: "Siła parallaksy (%)", widget: number, value_type: int, default: 100, min: 0, max: 200, required: false }

      - name: uslugi_kafelki
        label: "Kafelki „Wszystko, czego potrzebują Twoje media”"
        file: "src/data/home.json"
        fields:
          - name: features
            label: Kafelki usług
            label_singular: Kafelek
            widget: list
            summary: "{{fields.title}}"
            hint: "Przeciągnij, aby zmienić kolejność. Warstwy są opcjonalne — bez nich kafelek pokazuje samą ikonę."
            fields:
              - { name: icon, label: "Ikona (animowana)", widget: select, default: montaz, options: [{ label: "Montaż (oś czasu)", value: montaz }, { label: "Motion (krzywa ruchu)", value: motion }, { label: "Rolki (telefon)", value: rolki }, { label: "Grafika (kadr)", value: grafika }, { label: "Transmisja (ekran z belką)", value: transmisja }, { label: "Dźwięk (fala)", value: dzwiek }, { label: "Kamera", value: kamera }, { label: "Strategia (cel)", value: strategia }] }
              - { name: title, label: "Tytuł", widget: string }
              - { name: body, label: "Opis", widget: text }
              - name: layers
                label: "Warstwy parallaksy (opcjonalnie, do 3)"
                label_singular: Warstwa
                widget: list
                required: false
                max: 3
                hint: "1920×1200 px. Pierwsza = tło, ostatnia = przód."
                fields: *layerfields
              - { name: strength, label: "Siła parallaksy (%)", widget: number, value_type: int, default: 100, min: 0, max: 200, required: false }

      - name: kolejnosc
        label: "Kolejność sekcji"
        file: "src/data/home.json"
        description: "Hero zawsze jest na górze. Przeciągnij sekcje, aby zmienić kolejność. Usunięta sekcja znika ze strony (możesz ją dodać z powrotem)."
        fields:
          - name: sections
            label: "Sekcje pod Hero"
            label_singular: Sekcja
            widget: list
            field: { name: section, label: "Sekcja", widget: select, options: [{ label: "Usługi — Wszystko, czego potrzebują Twoje media", value: uslugi }, { label: "Dla kogo", value: dlaKogo }, { label: "Oferta — pakiety", value: oferta }, { label: "Opinie", value: opinie }, { label: "FAQ — pytania", value: faq }, { label: "Kontakt — końcowe wezwanie", value: kontakt }] }

  - name: landingi
    label: "Landingi ofert"
    description: "Strony /oferta/… — edytujesz każdy tekst, łamanie linii (Enter) i wyrównanie sekcji. Enter = nowa linia. **tekst** = pogrubienie. Krótkie słowa (i, w, z…) same nie zostaną na końcu linii."
    files:
      - name: dzial-wideo
        label: "Dział wideo (Pakiet PRO) — /oferta/dzial-wideo"
        file: "src/data/oferty/dzial-wideo.json"
        fields: &oferta
          - { name: name, label: "Nazwa (w linkach „Zobacz też”)", widget: string }
          - { name: order, label: "Kolejność", widget: number, value_type: int, default: 1 }
          - { name: seoTitle, label: "Tytuł dla Google", widget: string, hint: "Do 60 znaków" }
          - { name: seoDesc, label: "Opis dla Google", widget: text, hint: "120–160 znaków" }
          - { name: service, label: "Nazwa usługi (dane dla Google)", widget: string }
          - { name: pdf, label: "Plik PDF oferty", widget: file, required: false }
          - { name: pkg, label: "Pakiet w generatorze", widget: select, default: pro, options: [start, pro, studio, none] }
          - name: hero
            label: "1. Pierwszy ekran"
            widget: object
            fields:
              - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
              - { name: title, label: "Nagłówek — linia cienka", widget: string, required: false }
              - { name: titleBold, label: "Nagłówek — linia gruba", widget: string, required: false }
              - { name: lead, label: "Zdanie pod nagłówkiem", widget: text, required: false, hint: "Enter = nowa linia. **tekst** = pogrubienie. Krótkie słowa (i, w, z…) same nie zostaną na końcu linii." }
              - { name: thumbs, label: "Pokaż miniatury zamiast karty z ceną", widget: boolean, default: false, required: false }
              - { name: align, label: "Wyrównanie tekstu", widget: select, default: lewo, required: false, options: [{ label: "Do lewej (zalecane)", value: lewo }, { label: "Do środka", value: srodek }, { label: "Wyjustowane", value: justuj }, { label: "Do prawej", value: prawo }] }
          - name: intro
            label: "2. Zanim zaczniemy"
            widget: object
            fields:
              - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
              - { name: title, label: "Tytuł — część pogrubiona", widget: string, required: false }
              - { name: titleLight, label: "Tytuł — część jasna", widget: string, required: false }
              - { name: text, label: "Treść", widget: text, required: false, hint: "Pusta linia = nowy akapit. Enter = nowa linia w akapicie." }
              - { name: signature, label: "Podpis", widget: string, required: false }
              - { name: signatureRole, label: "Podpis — rola", widget: string, required: false }
              - { name: align, label: "Wyrównanie tekstu", widget: select, default: lewo, required: false, options: [{ label: "Do lewej (zalecane)", value: lewo }, { label: "Do środka", value: srodek }, { label: "Wyjustowane", value: justuj }, { label: "Do prawej", value: prawo }] }
          - name: become
            label: "3. Kim się stajesz"
            widget: object
            fields:
              - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
              - { name: title, label: "Tytuł — część pogrubiona", widget: string, required: false }
              - { name: titleLight, label: "Tytuł — część jasna", widget: string, required: false }
              - { name: lead, label: "Zdanie pod tytułem", widget: text, required: false }
              - name: items
                label: "Karty"
                label_singular: Karta
                widget: list
                summary: "{{fields.t}}"
                fields:
                  - { name: t, label: "Tytuł", widget: string, required: false }
                  - { name: d, label: "Opis", widget: text, required: false }
              - { name: punch, label: "Zdanie na końcu", widget: text, required: false }
              - { name: align, label: "Wyrównanie tekstu", widget: select, default: lewo, required: false, options: [{ label: "Do lewej (zalecane)", value: lewo }, { label: "Do środka", value: srodek }, { label: "Wyjustowane", value: justuj }, { label: "Do prawej", value: prawo }] }
          - name: stats
            label: "4. Liczby rynku"
            widget: object
            fields:
              - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
              - { name: title, label: "Tytuł — część pogrubiona", widget: string, required: false }
              - { name: titleLight, label: "Tytuł — część jasna", widget: string, required: false }
              - { name: note, label: "Dopisek z boku", widget: text, required: false }
              - name: items
                label: "Liczby"
                label_singular: Liczba
                widget: list
                summary: "{{fields.v}}{{fields.suf}}"
                fields:
                  - { name: v, label: "Wartość", widget: number, value_type: float }
                  - { name: suf, label: "Po liczbie (%, mln…)", widget: string, required: false }
                  - { name: d, label: "Opis", widget: text, required: false }
                  - { name: src, label: "Źródło", widget: string, required: false }
          - name: proof
            label: "5. Wyniki — wykresy"
            widget: object
            fields:
              - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
              - { name: title, label: "Tytuł — część pogrubiona", widget: string, required: false }
              - { name: titleLight, label: "Tytuł — część jasna", widget: string, required: false }
              - { name: lead, label: "Zdanie pod tytułem", widget: text, required: false }
              - name: charts
                label: "Wykresy porównawcze"
                label_singular: Wykres
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { name: title, label: "Tytuł wykresu", widget: string, required: false }
                  - { name: sub, label: "Podtytuł", widget: string, required: false }
                  - { name: unit, label: "Jednostka (np. %)", widget: string, required: false }
                  - { name: max, label: "Skala — maksimum", widget: number, value_type: float, required: false, hint: "Puste = automatycznie" }
                  - { name: source, label: "Źródło danych", widget: string, required: false }
                  - name: bars
                    label: "Słupki"
                    label_singular: Słupek
                    widget: list
                    summary: "{{fields.label}}: {{fields.value}}"
                    fields:
                      - { name: label, label: "Etykieta", widget: string, required: false }
                      - { name: value, label: "Wartość", widget: number, value_type: float }
                      - { name: highlight, label: "Nasz wynik (wyróżniony kolorem)", widget: boolean, default: false, required: false }
                      - { name: from, label: "Zakres od (opcjonalnie)", widget: number, value_type: float, required: false }
                      - { name: to, label: "Zakres do (opcjonalnie)", widget: number, value_type: float, required: false }
                      - { name: display, label: "Własny napis zamiast liczby", widget: string, required: false }
                      - { name: note, label: "Dopisek pod słupkiem", widget: string, required: false }
              - { name: deltaLine, label: "Pokaż wykres 150+ rolek Delta HR", widget: boolean, default: false, required: false }
              - { name: align, label: "Wyrównanie tekstu", widget: select, default: lewo, required: false, options: [{ label: "Do lewej (zalecane)", value: lewo }, { label: "Do środka", value: srodek }, { label: "Wyjustowane", value: justuj }, { label: "Do prawej", value: prawo }] }
          - name: inside
            label: "6. Co w środku"
            widget: object
            fields:
              - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
              - { name: title, label: "Tytuł — część pogrubiona", widget: string, required: false }
              - { name: titleLight, label: "Tytuł — część jasna", widget: string, required: false }
              - { name: lead, label: "Zdanie pod tytułem", widget: text, required: false }
              - name: items
                label: "Elementy"
                label_singular: Element
                widget: list
                summary: "{{fields.n}} {{fields.t}}"
                fields:
                  - { name: n, label: "Liczba / numer", widget: string, required: false }
                  - { name: t, label: "Tytuł", widget: string, required: false }
                  - { name: d, label: "Opis", widget: text, required: false }
              - { name: cardEyebrow, label: "Karta klipu — nadtytuł (tylko kampania)", widget: string, required: false }
              - { name: cardTitle, label: "Karta klipu — tytuł", widget: string, required: false }
              - { name: cardTitleLight, label: "Karta klipu — tytuł jasny", widget: string, required: false }
              - { name: cardText, label: "Karta klipu — opis", widget: text, required: false }
              - { name: listEyebrow, label: "Nadtytuł listy", widget: string, required: false }
              - { name: align, label: "Wyrównanie tekstu", widget: select, default: lewo, required: false, options: [{ label: "Do lewej (zalecane)", value: lewo }, { label: "Do środka", value: srodek }, { label: "Wyjustowane", value: justuj }, { label: "Do prawej", value: prawo }] }
          - name: special
            label: "7. Sekcja specjalna (rytm / anatomia / algorytm)"
            widget: object
            fields:
              - { name: kind, label: "Rodzaj", widget: select, options: [{ label: "Rytm miesiąca (tabela)", value: rytm }, { label: "Anatomia klipu (oś czasu)", value: anatomia }, { label: "Algorytm (lejek)", value: algorytm }] }
              - { name: eyebrow, label: "Nadtytuł", widget: string, required: false }
              - { name: title, label: "Tytuł — część pogrubiona", widget: string, required: false }
              - { name: titleLight, label: "Tytuł — część jasna", widget: string, required: false }
