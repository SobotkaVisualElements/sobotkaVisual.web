            widget: object
            fields:
              - { name: title, label: "Tytuł", widget: string }
              - { name: lead, label: "Zdanie pod tytułem", widget: text }

      - name: kafelki
        label: "Kafelki „Dla kogo”"
        file: "src/data/home.json"
        fields:
