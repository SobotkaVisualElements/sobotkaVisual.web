# Pages CMS (app.pagescms.org) — drugi, wygodniejszy panel do tych samych plików co /admin (Sveltia).
# Oba panele mogą działać równolegle. Ten plik nie wpływa na wygląd ani działanie strony.
media:
  input: public/uploads
  output: /uploads
content:
- name: realizacje
  label: Realizacje
  type: collection
  path: src/content/work
  format: yaml-frontmatter
  filename: '{primary}.md'
  view:
    primary: title
    sort: date
    order: desc
    fields:
    - title
    - date
    - category
  fields:
  - name: title
    label: Tytuł
    type: string
    required: true
  - name: description
    label: Krótki opis (Google)
    type: text
    required: true
  - name: category
    label: Kategoria
    type: select
    options:
      values:
      - Montaż
      - Animacja
      - Identyfikacja
      - Oprawa transmisyjna
      - Grafika
  - name: client
    label: Klient
    type: string
  - name: clientLogo
    label: Logotyp klienta (PNG/SVG, przezroczyste tło)
    type: image
  - name: role
    label: Rola / zakres
    type: string
  - name: year
    label: Rok
    type: number
  - name: date
    label: Data realizacji
    type: date
    options:
      format: yyyy-MM-dd
  - name: tech
    label: Narzędzia
    type: string
    list: true
  - name: cover
    label: Baner 1920×1200 (kafelek i nagłówek)
    type: image
  - name: poster
    label: Okładka pionowa 1200×1920 (karuzela)
    type: image
  - name: youtube
    label: Film YouTube w nagłówku
    type: string
  - name: video
    label: albo plik MP4 w nagłówku
    type: file
  - &id005
    name: layers
    label: Warstwy parallaksy (do 3, 1920×1200)
    type: object
    fields:
    - name: image
      label: Obraz
      type: image
    - name: depth
      label: Głębia 0–100
      type: number
    - name: scale
      label: Skala % (100–160)
      type: number
    list:
      collapsible:
        collapsed: true
        summary: Warstwa {index}
  - name: parallaxStrength
    label: Siła parallaksy %
    type: number
  - name: featured
    label: Wyróżniona
    type: boolean
  - name: order
    label: Kolejność (przy tej samej dacie)
    type: number
  - name: body
    label: Treść
    type: rich-text
    options:
      format: markdown
  - &id006
    name: blocks
    label: Klocki treści
    type: block
    list: true
    blockKey: type
    blocks:
    - name: tekst
      label: Tekst
      fields:
      - name: text
        label: Tekst
        type: rich-text
        options:
          format: markdown
    - name: zdjecie
      label: Zdjęcie
      fields:
      - name: image
        label: Zdjęcie
        type: image
      - name: caption
        label: Podpis
        type: string
      - name: alt
        label: Opis dla Google (alt)
        type: string
      - name: width
        label: Szerokość
        type: select
        options:
          values:
          - name: pelna
            label: Pełna
          - name: waska
            label: Wąska
    - name: karuzela
      label: Karuzela zdjęć
      fields:
      - name: images
        label: Zdjęcia
        type: object
        fields:
        - name: image
          label: Zdjęcie
          type: image
        - name: caption
          label: Podpis
          type: string
        list:
          collapsible:
            collapsed: true
            summary: '{caption}'
    - name: karuzela3d
      label: Karuzela 3D (jak na głównej)
      fields:
      - name: orientation
        label: Format kafelków
        type: select
        options:
          values:
          - name: poziom
            label: Poziome banery 16:10 (realizacje filmowe)
          - name: miniatury
            label: Miniatury YouTube 16:9
          - name: pion
            label: Pionowe okładki 10:16
      - name: items
        label: Kafelki
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{title}'
        fields:
        - name: image
          label: Obraz (można pominąć przy linku YouTube)
          type: image
        - name: youtube
          label: Link YouTube (odtwarza się po kliknięciu)
          type: string
        - name: title
          label: Tytuł pod karuzelą
          type: string
        - name: link
          label: albo link do strony (np. /work/...)
          type: string
        - name: logo
          label: Logotyp klienta
          type: image
      - name: caption
        label: Podpis
        type: string
    - name: wideo
      label: Wideo
      fields:
      - name: youtube
        label: Link YouTube
        type: string
      - name: file
        label: albo plik MP4
        type: file
      - name: format
        label: Format
        type: select
        options:
          values:
          - '16:9'
          - '9:16'
      - name: mode
        label: Tryb
        type: select
        options:
          values:
          - name: petla
            label: Pętla + przycisk dźwięku
          - name: zwykly
            label: Zwykły odtwarzacz
      - name: caption
        label: Podpis
        type: string
    - name: parallaksa
      label: Kafelek z parallaksą
      fields:
      - name: layers
        label: Warstwy
        type: object
        fields:
        - name: image
          label: Obraz
          type: image
        - name: depth
          label: Głębia
          type: number
        - name: scale
          label: Skala %
          type: number
        list:
          collapsible:
            collapsed: true
            summary: Warstwa {index}
      - name: strength
        label: Siła parallaksy %
        type: number
      - name: caption
        label: Podpis
        type: string
    - name: wykres_liniowy
      label: Wykres liniowy
      fields:
      - name: value
        label: Wartość
        type: number
      - name: label
        label: Czego dotyczy
        type: string
      - name: points
        label: Punkty (po przecinku)
        type: string
      - name: prefix
        label: Przed liczbą
        type: string
      - name: suffix
        label: Po liczbie
        type: string
      - name: description
        label: Opis
        type: text
    - name: wykres_kolowy
      label: Wykres kołowy %
      fields:
      - name: value
        label: Wartość 0–100
        type: number
      - name: label
        label: Czego dotyczy
        type: string
      - name: suffix
        label: Po liczbie
        type: string
      - name: description
        label: Opis
        type: text
    - name: cytat
      label: Cytat
      fields:
      - name: text
        label: Treść
        type: text
      - name: author
        label: Autor
        type: string
      - name: role
        label: Rola / firma
        type: string
- name: landingi
  label: Landingi ofert
  type: collection
  path: src/data/oferty
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    sort: order
  fields:
  - name: name
    label: Nazwa
    type: string
    required: true
  - name: layout
    label: Wygląd
    type: select
    options:
      values:
      - name: klasyczny
        label: Klasyczny
      - name: kinetyczny
        label: Kinetyczny (animacje przy przewijaniu)
  - name: theme
    label: Motyw (kinetyczny)
    type: select
    options:
      values:
      - name: jasny
        label: Jasny
      - name: ciemny
        label: Ciemny
      - name: swiateczny
        label: Świąteczny
      - name: izometryczny
        label: Izometryczny
  - name: draft
    label: Szkic (strona nie istnieje)
    type: boolean
  - name: noindex
    label: Ukryj przed Google (tylko z linku)
    type: boolean
  - name: order
    label: Kolejność
    type: number
  - name: seoTitle
    label: Tytuł dla Google
    type: string
  - name: seoDesc
    label: Opis dla Google
    type: text
  - name: service
    label: Nazwa usługi (Google)
    type: string
  - name: pdf
    label: PDF oferty
    type: file
  - name: pkg
    label: Pakiet w generatorze
    type: select
    options:
      values:
      - start
      - pro
      - studio
      - none
  - name: marquee
    label: Napis przesuwający się (kinetyczny)
    type: string
    description: Słowa oddzielone ukośnikiem, np. MONTAŻ / ANIMACJA / ROLKI
  - name: ui
    label: Układ i rozmiary (podgląd — dopisz ?edytuj do adresu strony)
    type: object
    fields:
    - name: hide
      label: Ukryj sekcje
      type: select
      options:
        multiple: true
        values:
        - {value: hero, label: Pierwszy ekran}
        - {value: marquee, label: Przelatujące karty (kinetyczny)}
        - {value: mission, label: Tekst zapalany słowami + liczby (kinetyczny)}
        - {value: steps, label: Kroki „Kim się stajesz”}
        - {value: bigs, label: Wielkie numery (kinetyczny)}
        - {value: zoom, label: Zoom z wynikami (kinetyczny)}
        - {value: charts, label: Wykresy}
        - {value: opinie, label: Opinie}
        - {value: cennik, label: Cennik (kinetyczny)}
        - {value: realizacje, label: Realizacje}
        - {value: faq, label: Pytania}
        - {value: final, label: Następny krok}
        - {value: intro, label: Zanim zaczniemy (klasyczny)}
        - {value: become, label: Kim się stajesz (klasyczny)}
        - {value: stats, label: Liczby rynku (klasyczny)}
        - {value: proof, label: Wyniki (klasyczny)}
        - {value: inside, label: Co w środku (klasyczny)}
        - {value: special, label: Sekcja specjalna (klasyczny)}
        - {value: doubts, label: Wątpliwości (klasyczny)}
        - {value: invest, label: Inwestycja (klasyczny)}
    - name: headSize
      label: Wielkość nagłówków
      type: select
      options:
        values: [{value: S, label: Mniejsze}, {value: M, label: Standard}, {value: L, label: Większe}, {value: XL, label: Ogromne}]
    - name: wordsSize
      label: Wielkość tekstu zapalanego słowami
      type: select
      options:
        values: [{value: S, label: Mniejszy}, {value: M, label: Standard}, {value: L, label: Większy}]
    - name: spacing
      label: Odstępy między sekcjami
      type: select
      options:
        values: [{value: ciasno, label: Ciasno}, {value: normalnie, label: Normalnie}, {value: przestronnie, label: Przestronnie}]
    - name: sceneLength
      label: Długość animowanych scen
      type: select
      options:
        values: [{value: krotko, label: Krótko}, {value: normalnie, label: Normalnie}, {value: dlugo, label: Długo}]
  - name: deadline
    label: Termin oferty + odliczanie (kinetyczny)
    type: object
    fields:
    - name: date
      label: Koniec oferty (np. 2026-12-06T23:59:59+01:00)
      type: string
    - name: eyebrow
      label: Nadtytuł
      type: string
    - name: title
      label: Napis — linia 1
      type: string
    - name: titleBold
      label: Napis — linia 2, ogromna
      type: string
    - name: lead
      label: Zdanie pod licznikiem
      type: text
    - name: expiredTitle
      label: Po terminie — tytuł
      type: string
    - name: expiredLead
      label: Po terminie — drugi wiersz
      type: string
    - name: expiredHo
      label: Po terminie — skaczący napis
      type: string
    - name: expiredNote
      label: Po terminie — dopisek
      type: text
  - name: hero
    label: 1. Pierwszy ekran
    type: object
    fields:
    - name: eyebrow
      label: Nadtytuł
      type: string
    - name: title
      label: Nagłówek — linia cienka
      type: string
    - name: titleBold
      label: Nagłówek — linia gruba
      type: string
    - name: lead
      label: Zdanie pod nagłówkiem
      type: text
    - name: bgImage
      label: Tło — obraz
      type: image
    - name: bgVideo
      label: Tło — wideo MP4
      type: file
    - name: bgOpacity
      label: Widoczność tła %
      type: number
    - name: sideImage
      label: Obraz obok nagłówka
      type: image
    - name: sideAlt
      label: Opis obrazu
      type: string
    - name: chipValue
      label: Chip — duża wartość (kinetyczny)
      type: string
    - name: chipLabel
      label: Chip — opis
      type: string
    - name: thumbs
      label: Miniatury zamiast karty
      type: boolean
    - &id001
      name: align
      label: Wyrównanie tekstu
      type: select
      options:
        values:
        - name: lewo
          label: Do lewej
        - name: srodek
          label: Do środka
        - name: justuj
          label: Wyjustowane
        - name: prawo
          label: Do prawej
  - name: intro
    label: 2. Zanim zaczniemy
    type: object
    fields:
    - &id002
      name: eyebrow
      label: Nadtytuł
      type: string
    - &id003
      name: title
      label: Tytuł — część pogrubiona
      type: string
    - &id004
      name: titleLight
      label: Tytuł — część jasna
      type: string
    - name: text
      label: Treść (pusta linia = akapit)
      type: text
    - name: signature
      label: Podpis
      type: string
    - name: signatureRole
      label: Podpis — rola
      type: string
    - *id001
  - name: become
    label: 3. Kim się stajesz
    type: object
    fields:
    - *id002
    - *id003
    - *id004
    - name: lead
      label: Zdanie pod tytułem
      type: text
    - name: items
      label: Karty
      type: object
      fields:
      - name: t
        label: Tytuł
        type: string
      - name: d
        label: Opis
        type: text
      list:
        collapsible:
          collapsed: true
          summary: '{t}'
    - name: punch
      label: Zdanie na końcu
      type: text
    - *id001
  - name: stats
    label: 4. Liczby rynku
    type: object
    fields:
    - *id002
    - *id003
    - *id004
    - name: note
      label: Dopisek
      type: text
    - name: items
      label: Liczby
      type: object
      fields:
      - name: v
        label: Wartość
        type: number
      - name: suf
        label: Po liczbie
        type: string
      - name: d
        label: Opis
        type: text
      - name: src
        label: Źródło
        type: string
      list:
        collapsible:
          collapsed: true
          summary: '{v}{suf}'
  - name: proof
    label: 5. Wyniki — wykresy
    type: object
    fields:
    - *id002
    - *id003
    - *id004
    - name: lead
      label: Zdanie pod tytułem
      type: text
    - name: charts
      label: Wykresy
      type: object
      fields:
      - name: title
        label: Tytuł
        type: string
      - name: sub
        label: Podtytuł
        type: string
      - name: unit
        label: Jednostka
        type: string
      - name: max
        label: Skala max
        type: number
      - name: source
        label: Źródło
        type: string
      - name: bars
        label: Słupki
        type: object
        fields:
        - name: label
          label: Etykieta
          type: string
        - name: value
          label: Wartość
          type: number
        - name: highlight
          label: Nasz wynik (wyróżniony)
          type: boolean
        - name: from
          label: Zakres od
          type: number
        - name: to
          label: Zakres do
          type: number
        - name: display
          label: Własny napis zamiast liczby
          type: string
        - name: note
          label: Dopisek
          type: string
        list:
          collapsible:
            collapsed: true
            summary: '{label}'
      list:
        collapsible:
          collapsed: true
          summary: '{title}'
    - name: image
      label: Obraz do sceny z przybliżeniem
      type: image
    - name: ctr
      label: Wykres przewagi CTR (karuzela miniatur w tle)
      type: object
      fields:
      - name: show
        label: Pokaż
        type: boolean
      - name: eyebrow
        label: Nadtytuł
        type: string
      - name: title
        label: Tytuł
        type: string
      - name: sub
        label: Opis pod tytułem
        type: text
      - name: watermark
        label: Wielki półprzezroczysty napis
        type: string
      - name: unit
        label: Jednostka (np. %)
        type: string
      - name: xStart
        label: Oś — początek
        type: string
      - name: xEnd
        label: Oś — koniec
        type: string
      - name: base
        label: Szara linia — typowo
        type: object
        fields:
        - name: label
          label: Opis
          type: string
        - name: value
          label: Wartość
          type: number
        - name: display
          label: Własny napis
          type: string
      - name: ours
        label: Zielona linia — z nami
        type: object
        fields:
        - name: label
          label: Opis
          type: string
        - name: value
          label: Wartość
          type: number
        - name: display
          label: Własny napis
          type: string
      - name: delta
        label: Napis na obszarze różnicy
        type: string
      - name: source
        label: Źródło danych
        type: text
      - name: quoteFrom
        label: Cytat pod wykresem — z opinii klienta
        type: select
        options:
          values:
          - Przemysław Langier
          - Adam Przebinda
      - name: thumbs
        label: Miniatury w tle
        type: object
        list: true
        fields:
        - name: image
          label: Miniatura 16:9
          type: image
        - name: youtube
          label: albo link YouTube
          type: string
    - name: deltaLine
      label: Pokaż wykres liniowy rolek (Delta HR)
      type: boolean
    - name: delta
      label: Wykres liniowy rolek — treść
      type: object
      fields:
      - name: prefix
        label: Przed liczbą (np. do )
        type: string
      - name: value
        label: Liczba
        type: number
      - name: suffix
        label: Po liczbie (np. +)
        type: string
      - name: label
        label: Opis pod liczbą
        type: string
      - name: points
        label: Punkty wykresu (po przecinku)
        type: string
      - name: description
        label: Tekst pod wykresem
        type: text
    - *id001
  - name: inside
    label: 6. Co w środku
    type: object
    fields:
    - *id002
    - *id003
    - *id004
    - name: lead
      label: Zdanie pod tytułem
      type: text
    - name: items
      label: Elementy
      type: object
      fields:
      - name: n
        label: Liczba / numer
        type: string
      - name: t
        label: Tytuł
        type: string
      - name: d
        label: Opis
        type: text
      list:
        collapsible:
          collapsed: true
          summary: '{n} {t}'
    - name: cardEyebrow
      label: Karta klipu — nadtytuł
      type: string
    - name: cardTitle
      label: Karta klipu — tytuł
      type: string
    - name: cardTitleLight
      label: Karta klipu — tytuł jasny
      type: string
    - name: cardText
      label: Karta klipu — opis
      type: text
    - name: listEyebrow
      label: Nadtytuł listy
      type: string
    - *id001
  - name: special
    label: 7. Sekcja specjalna
    type: object
    fields:
    - name: kind
      label: Rodzaj
      type: select
      options:
        values:
        - name: ''
          label: Brak
        - name: rytm
          label: Rytm miesiąca
        - name: anatomia
          label: Anatomia klipu
        - name: algorytm
          label: Algorytm
    - *id002
    - *id003
    - *id004
    - name: lead
      label: Zdanie pod tytułem
      type: text
    - name: scale
      label: Wykres skali rocznej (nad tabelą rytmu)
      type: object
      fields:
      - name: show
        label: Pokaż
        type: boolean
      - name: eyebrow
        label: Nadtytuł
        type: string
      - name: title
        label: Tytuł
        type: string
      - name: sub
        label: Opis pod tytułem
        type: text
      - name: watermark
        label: Wielki półprzezroczysty napis
        type: string
      - name: unit
        label: Jednostka (np. %)
        type: string
      - name: xStart
        label: Oś — początek
        type: string
      - name: xEnd
        label: Oś — koniec
        type: string
      - name: base
        label: Szara linia — typowo
        type: object
        fields:
        - name: label
          label: Opis
          type: string
        - name: value
          label: Wartość
          type: number
        - name: display
          label: Własny napis
          type: string
      - name: ours
        label: Zielona linia — z nami
        type: object
        fields:
        - name: label
          label: Opis
          type: string
        - name: value
          label: Wartość
          type: number
        - name: display
          label: Własny napis
          type: string
      - name: delta
        label: Napis na obszarze różnicy
        type: string
      - name: source
        label: Źródło danych
        type: text
    - name: table
      label: Tabela tygodni
      type: object
      fields:
      - name: label
        label: Wiersz
        type: string
      - name: w1
        label: Tydz. 1
        type: string
      - name: w2
        label: Tydz. 2
        type: string
      - name: w3
        label: Tydz. 3
        type: string
      - name: w4
        label: Tydz. 4
        type: string
      list:
        collapsible:
          collapsed: true
          summary: '{label}'
    - name: timeline
      label: Oś czasu
      type: object
      fields:
      - name: sec
        label: Sekundy
        type: number
      - name: time
        label: Czas
        type: string
      - name: label
        label: Nazwa
        type: string
      - name: desc
        label: Opis
        type: text
      - name: highlight
        label: Wyróżnij
        type: boolean
      list:
        collapsible:
          collapsed: true
          summary: '{time} {label}'
    - name: steps
      label: Kroki lejka
      type: object
      fields:
      - name: t
        label: Krok
        type: string
      - name: d
        label: Opis
        type: string
      list:
        collapsible:
          collapsed: true
          summary: '{t}'
    - name: cards
      label: Karty
      type: object
      fields:
      - name: k
        label: Etykieta
        type: string
      - name: t
        label: Tytuł
        type: string
      - name: d
        label: Opis
        type: text
